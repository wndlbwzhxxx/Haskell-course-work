name:                metro-pathfinder
version:             0.1.0.0
github:              "githubuser/metro-pathfinder"
license:             BSD-3-Clause
author:              "Author name here"
maintainer:          "example@example.com"
copyright:           "2026 Author name here"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/githubuser/metro-pathfinder#readme>

dependencies:
- base >= 4.14 && < 5
- containers >= 0.6.5.1
- text >= 2.0.1
- time >= 1.11.1
- directory >= 1.3.7.0
- bytestring >= 0.11.3.0
- filepath >= 1.4.2
- aeson >= 2.0.3.0

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src
  exposed-modules:
    - Graph.Types
    - Graph.Dijkstra
    - Graph.Loader
    - CLI.Menu
    - Visualization.Render
    - Logging.Logger

executables:
  metro-pathfinder-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - metro-pathfinder

tests:
  metro-pathfinder-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - metro-pathfinder
    - QuickCheck
